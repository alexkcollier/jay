# yazi in the hub's files pane only (wt-hub-pane sets YAZI_CONFIG_HOME to
# ~/.config/wt-hub/yazi). e goes back to review, as e in tuicr shows files. o opens the hovered
# file or folder in your editor, in its project (git root), through wt-edit: a terminal editor
# in a new Ghostty tab. O keeps yazi's own "open with" menu.
[mgr]
prepend_keymap = [
  { on = "e", run = "quit", desc = "Back to review (wt-hub)" },
  { on = "o", run = 'shell -- "$HOME/.local/bin/wt-edit" %h', desc = "Open in editor, in its project (wt-hub)" },
]
