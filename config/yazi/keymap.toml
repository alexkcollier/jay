# yazi in the hub's files pane only (wt-hub-pane sets YAZI_CONFIG_HOME to
# ~/.config/wt-hub/yazi). e goes back to review, as e in tuicr shows files. o stays yazi's open
# (in this pane); O opens the hovered file or folder in your editor, in its project (git root),
# through wt-edit: a terminal editor in a new Ghostty tab. yazi's "open with" menu (its O)
# moves to W (Alex).
[mgr]
prepend_keymap = [
  { on = "e", run = "quit", desc = "Back to review (wt-hub)" },
  { on = "O", run = 'shell -- "$HOME/.local/bin/wt-edit" %h', desc = "Open in editor, in its project, new tab (wt-hub)" },
  { on = "W", run = "open --interactive", desc = "Open with... (wt-hub)" },
]
