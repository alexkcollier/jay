# jay's tmux config: the hub's own server (tmux -L jay -f ~/.config/jay/tmux.conf, see
# lib/jay-mux-tmux.sh). Your ~/.tmux.conf does not load here, and this file does not change your
# own tmux. install.sh links or copies it to ~/.config/jay/tmux.conf.

# --- Terminal ---
set -g default-terminal tmux-256color
# Ghostty (and other xterm-likes): true color, the extended keys (Shift+Enter, Ctrl+Enter reach
# Claude as CSI u), the clipboard (OSC 52), focus events and synchronized output.
set -as terminal-features ',xterm-ghostty:RGB:extkeys:clipboard:focus:sync:hyperlinks:usstyle'
set -as terminal-features ',xterm*:RGB:extkeys'
set -g extended-keys on
set -g extended-keys-format csi-u
set -g escape-time 10
# Cmd keys: with the extended keys on, Ghostty sends a Cmd key that it does not use itself (Cmd+P,
# Cmd+O) as CSI 27 with the Super bit, and tmux makes that bit Meta (it has no Super): the pane got
# Alt+P, which opens Claude's model picker, and Alt+O, which turns fast mode on or off. tmux cannot
# tell them from a real Alt+P or Alt+O (Option as Alt), so these stop here too; /model and /fast
# in Claude do the same. M-P too: a DCS reply of the terminal that tmux does not expect (ESC P ...)
# reaches the pane as M-P and the reply's text, and Claude reads M-P (CSI 80;3u) as Alt+P.
bind -n M-p switch-client -T root
bind -n M-P switch-client -T root
bind -n M-o switch-client -T root
set -g focus-events on
set -g set-clipboard on
set -g history-limit 50000
set -g mouse on
# A double or triple click on a pane that takes the mouse (fzf, Claude) goes to the program only.
# tmux's own binds select the clicked pane again, and tmux sends the double click a moment late:
# after a double click in the list had opened an agent and moved the focus to it, the focus went
# back to the list. The first click selected the pane already.
bind -n DoubleClick1Pane if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } {
  select-pane -t = ; copy-mode -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel }
bind -n TripleClick1Pane if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } {
  select-pane -t = ; copy-mode -H ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel }
# The terminal tab's title, as zellij's: the session and the focused pane's title
# ("jay | fix-login"). tmux sends it again when the focus moves or the pane is renamed.
set -g set-titles on
set -g set-titles-string '#S | #{pane_title}'

# --- Panes and windows: names come from jay, never from the programs ---
set -g base-index 0
set -g pane-base-index 0
set -g renumber-windows on
set -g allow-rename off
set -g automatic-rename off
setw -g allow-set-title off
set -g remain-on-exit off
set -g pane-border-status top
# Titles in the middle of the top border, as zellij's frames.
set -g pane-border-format '#[align=centre] #{pane_title} '
set -g pane-border-lines single
set -g pane-border-style 'fg=#54546D'
set -g pane-active-border-style 'fg=#7E9CD8'
set -g display-time 2000
set -g message-style 'fg=#1F1F28,bg=#E6C384'
set -g mode-style 'fg=#1F1F28,bg=#7E9CD8'

# --- Status: one line at the top, as the zellij hub's. Left: the window you are on, "◆ JAY › hub ›"
# and the picked worktree (a tasks window: "◆ JAY › tasks ›", its worktree and the tasks
# elsewhere). Middle: the agent counts, or the keys of Ctrl g while it waits for one. Right: the tasks,
# then the time. The parts are window options (@jay_left, @jay_mid, @jay_right) that the hub
# cuts to the window's width (jay_mux_status, jay_bar_fit in lib/jay-lib.sh). On the terminal's
# own colors.
set -g status on
set -g status-position top
set -g status-interval 2
set -g status-style 'fg=default,bg=default'
set -g status-format[0] '#[fill=default,bg=default] #{@jay_left}#[default]   #{?#{==:#{client_key_table},jay},#[fg=#1F1F28#,bg=#E6C384#,bold] Ctrl g #[default] h l 1 2 3 ; v Tab r t q,#{@jay_mid}}#[default]#[align=right]#{@jay_right}#[default]  #[fg=#727169]%H:%M '

# --- Keys: no prefix; Ctrl g then one key (the jay table), as in the zellij hub ---
set -g prefix None
unbind C-b
bind -n C-g switch-client -T jay
bind -T jay h select-pane -L
bind -T jay l select-pane -R
# 1 2 3: the hub's columns. @jay_cols: the roles of the hub window's panes from the left
# ("list agent review "; files over review has none). A pane that is missing (closed, the hub
# window closed) comes back first, through jay-sidebar --focus.
set -g @jay_cols '#{W:#{?#{==:#{window_name},hub},#{P:#{@jay_role} },}}'
bind -T jay 1 if -F '#{m:list *,#{E:@jay_cols}}' { select-window -t :hub ; select-pane -t :hub.0 } {
  run-shell -b '~/.local/bin/jay-sidebar --focus list' }
bind -T jay 2 if -F '#{m:list agent *,#{E:@jay_cols}}' { select-window -t :hub ; select-pane -t :hub.1 } {
  run-shell -b '~/.local/bin/jay-sidebar --focus agent' }
bind -T jay 3 if -F '#{@jay_hidden}' { run-shell -b '~/.local/bin/jay-sidebar --review show' } {
  if -F '#{m:list agent ?*,#{E:@jay_cols}}' { select-window -t :hub ; select-pane -t :hub.2 } {
    run-shell -b '~/.local/bin/jay-sidebar --focus review' } }
bind -T jay \; last-pane
bind -T jay v run-shell -b '~/.local/bin/jay-sidebar --review toggle'
bind -T jay Tab run-shell -b '~/.local/bin/jay-run --switch'
bind -T jay r display-popup -E -e JAY_POPUP=1 -w 70% -h 14 -T ' run in #{?#{==:#{window_name},hub},#{@jay_where},#{@jay_wt}} · Enter: run · Ctrl-C: cancel ' '~/.local/bin/jay-run --launcher'
bind -T jay t display-popup -E -e JAY_POPUP=1 -w 80% -h 60% -T ' tasks ' '~/.local/bin/jay-run --pick'
bind -T jay q detach-client
bind -T jay [ copy-mode
# Ctrl g twice: a Ctrl g for the program in the pane.
bind -T jay C-g send-keys C-g
