# The hub's worktrunk settings. ~/.config/worktrunk/config.toml is a real file, not a link to
# this one, so client settings ([projects."..."] entries) stay out of this repo: copy this file
# there once, or merge these keys into the file that is there.
worktree-path = "{{ repo_path }}/../{{ repo }}.{{ branch | sanitize }}"

pre-start = "wt-setup"

[list.custom-columns.Task]
template = "{{ vars.task }}"
width = 40
priority = 5

[aliases]
task = "{% if args %}wt config state vars set task={{ args }}{% else %}wt config state vars get task{% endif %}"
