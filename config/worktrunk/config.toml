# The hub's worktrunk settings. install.sh copies this file to ~/.config/worktrunk/config.toml
# when there is none (a real file, not a link: your own settings go there too), or lists the
# keys to merge into the file that is there. `install.sh --with-setup` also adds
# pre-start = "jay-setup" (in each new worktree: copy ignored files, install dependencies).
worktree-path = "{{ repo_path }}/../{{ repo }}.{{ branch | sanitize }}"

[list.custom-columns.Task]
template = "{{ vars.task }}"
width = 40
priority = 5

[aliases]
task = "{% if args %}wt config state vars set task={{ args }}{% else %}wt config state vars get task{% endif %}"
