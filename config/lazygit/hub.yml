# lazygit settings for the hub's review pane (JAY_REVIEW=lazygit), installed as
# ~/.config/jay/lazygit/hub.yml. jay-lazygit loads your own config.yml first and this file
# over it (LG_CONFIG_FILE), so your theme stays; the diff renderers are the hub's (below). Your
# own lazygit outside the hub does not read this file.
gui:
  showRandomTip: false
  showCommandLog: false
  showPanelJumps: false
  showBottomLine: false
  # One tab group: the right column is narrow. Commits first, so `lazygit log` opens on it.
  sidePanels:
    - [commits, files, branches]
  portraitMode: always
  screenMode: half
  enlargedSideViewLocation: top
  # The rows are narrow: no author and no hash (the patch shows both).
  commitAuthorShortLength: 0
  commitAuthorLongLength: 0
  commitHashLength: 0
disableStartupPopups: true
promptToReturnFromSubprocess: false
update:
  method: never
git:
  # The patch for a narrow column: jay-diff gives a bar on each file (3/8, status, path), a
  # line on each hunk (path:line 2/3), one column of line numbers, and wraps long lines under
  # the code. | cycles the renderers; JAY_REVIEW_DIFF in ~/.config/jay/config puts another
  # one first (diff-difft.yml, diff-plain.yml next to this file).
  diffRenderers:
    - name: delta (hub)
      command: "$HOME/.local/bin/jay-diff delta {{width}} {{colorScheme}}"
    - name: difftastic (hub)
      type: extDiff
      command: "$HOME/.local/bin/jay-diff difft {{width}} {{colorScheme}}"
    - name: delta (plain)
      command: "delta --no-gitconfig --{{colorScheme}} --paging=never --true-color=always --line-numbers --line-numbers-left-format= --line-numbers-right-format='{np:>4}│' --hunk-header-style='file line-number syntax' --hunk-header-decoration-style=none --file-decoration-style=ol"
  autoFetch: false
  log:
    # A turn chain has no merges; the graph takes two columns.
    showGraph: never
keybinding:
  universal:
    # e: files (the hub's key, below); lazygit's own open in editor stays on o.
    edit: <disabled>
  commits:
    # t: turns or commits (the hub's key, below).
    revertCommit: <disabled>
customCommands:
  - key: t
    context: global
    description: "hub: turns or commits"
    command: "$HOME/.local/bin/jay-lazygit --toggle"
    output: none
  - key: e
    context: global
    description: "hub: files (yazi)"
    command: "$HOME/.local/bin/jay-sidebar --files"
    output: none
